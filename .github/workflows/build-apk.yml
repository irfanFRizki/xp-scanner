name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-release:
        description: 'Skip GitHub Release creation (for testing signed build + fingerprint)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Never expose signing secrets on pull_request builds; all 4 signing secrets are required for non-PR release signing
      HAS_SIGNING: ${{ github.event_name != 'pull_request' && secrets.XUPING_KEYSTORE_BASE64 != '' && secrets.XUPING_KEYSTORE_PASSWORD != '' && secrets.XUPING_KEY_ALIAS != '' && secrets.XUPING_KEY_PASSWORD != '' }}
      # Expected SHA-256 fingerprint of the v1.0.3+ release key (CN=Xuping Scanner)
      EXPECTED_FINGERPRINT: "D0:86:64:F1:13:E7:E5:67:00:93:35:48:5B:F3:58:0B:64:F2:C1:C5:02:17:76:BF:0D:AB:66:26:F6:E1:2A:FD"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          # versionCode from GITHUB_RUN_NUMBER (always >= 2, monotonic)
          VERSION_CODE=$(( GITHUB_RUN_NUMBER ))
          if (( VERSION_CODE < 2 )); then VERSION_CODE=2; fi

          # versionName from tag if tag build, else dev version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}-dev"
            IS_RELEASE=false
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "versionCode -> ${VERSION_CODE}, versionName -> ${VERSION}, isRelease -> ${IS_RELEASE}"

      - name: Inject version into www/index.html
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/var APP_VERSION = '[^']*';/var APP_VERSION = '${APP_VERSION}';/" www/index.html
          grep -qF "var APP_VERSION = '${APP_VERSION}';" www/index.html
          echo "www/index.html APP_VERSION -> ${APP_VERSION}"

      - name: Inject version into android/app/build.gradle
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i -E "s/^([[:space:]]*versionCode )[0-9]+/\\1${VERSION_CODE}/" android/app/build.gradle
          sed -i -E 's/^([[:space:]]*versionName )"[^"]*"/\1"'"${VERSION_NAME}"'"/' android/app/build.gradle
          grep -qE "^[[:space:]]*versionCode ${VERSION_CODE}$" android/app/build.gradle
          grep -qF "versionName \"${VERSION_NAME}\"" android/app/build.gradle
          echo "android/app/build.gradle versionCode -> ${VERSION_CODE}, versionName -> ${VERSION_NAME}"

      - name: Inject version into package.json
        env:
          PKG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          npm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version -> $(node -p "require('./package.json').version")"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Require signing secrets for release tags
        if: ${{ steps.version.outputs.IS_RELEASE == 'true' && env.HAS_SIGNING != 'true' }}
        run: |
          echo "::error::Release tag builds require signing secrets (XUPING_KEYSTORE_BASE64, XUPING_KEYSTORE_PASSWORD, XUPING_KEY_ALIAS, XUPING_KEY_PASSWORD)."
          exit 1

      - name: Decode signing keystore
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING == 'true' }}
        env:
          XUPING_KEYSTORE_BASE64: ${{ secrets.XUPING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$XUPING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/xuping-scanner.keystore
          test -s android/app/xuping-scanner.keystore
          echo "XUPING_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/app/xuping-scanner.keystore" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING == 'true' }}
        working-directory: android
        env:
          XUPING_KEYSTORE_PASSWORD: ${{ secrets.XUPING_KEYSTORE_PASSWORD }}
          XUPING_KEY_ALIAS: ${{ secrets.XUPING_KEY_ALIAS }}
          XUPING_KEY_PASSWORD: ${{ secrets.XUPING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release APK (unsigned)
        if: ${{ github.event_name == 'pull_request' || env.HAS_SIGNING != 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK fingerprint
        if: ${{ (github.event_name != 'pull_request' && env.HAS_SIGNING == 'true') || steps.version.outputs.IS_RELEASE == 'true' }}
        env:
          EXPECTED_FINGERPRINT: ${{ env.EXPECTED_FINGERPRINT }}
          IS_RELEASE: ${{ steps.version.outputs.IS_RELEASE }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found at $APK"
            exit 1
          fi

          # ---- locate apksigner (no apt-get; use runner's Android SDK) ----
          # GitHub-hosted ubuntu runners have Android SDK at /usr/local/lib/android/sdk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools"

          find_apksigner() {
            local dir="$1"
            local p matches=""
            for p in "$dir"/*/apksigner; do
              if [ -x "$p" ]; then
                matches+="${p}"$'\n'
              fi
            done
            if [ -n "$matches" ]; then
              printf '%s' "$matches" | sort -V | tail -n1
            fi
          }

          echo "Searching for apksigner in: $BUILD_TOOLS_DIR/*/apksigner"
          APKSIGNER=$(find_apksigner "$BUILD_TOOLS_DIR")

          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $BUILD_TOOLS_DIR"
            echo "Checked SDK_ROOT=$SDK_ROOT (ANDROID_HOME=${ANDROID_HOME:-<unset>}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>})"
            if [ -d "$BUILD_TOOLS_DIR" ]; then
              echo "Contents of $BUILD_TOOLS_DIR:"
              ls -la "$BUILD_TOOLS_DIR" || true
            elif [ -d "$SDK_ROOT" ]; then
              echo "Directory $BUILD_TOOLS_DIR does not exist. Contents of $SDK_ROOT:"
              ls -la "$SDK_ROOT" || true
            else
              echo "SDK_ROOT directory $SDK_ROOT does not exist."
            fi
            for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk" "/opt/android/sdk" "/home/runner/android-sdk" "${HOME:+$HOME/Android/Sdk}"; do
              if [ -n "$candidate" ] && [ -d "$candidate/build-tools" ]; then
                echo "Candidate SDK build-tools directory found: $candidate/build-tools"
                ls -la "$candidate/build-tools" || true
              fi
            done

            # Derive required build-tools version from project config / AGP
            BT_VERSION=$(sed -nE "s/^[[:space:]]*buildToolsVersion([[:space:]]*=[[:space:]]*|[[:space:]]+)['\"]([^'\"]+)['\"].*/\2/p" android/app/build.gradle android/variables.gradle 2>/dev/null | head -n1 || true)
            AGP_VERSION=$(sed -nE "s/.*com\.android\.tools\.build:gradle:([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p" android/build.gradle 2>/dev/null | head -n1 || true)
            COMPILE_SDK=$(sed -nE "s/^[[:space:]]*compileSdkVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p" android/variables.gradle 2>/dev/null | head -n1 || true)

            if [ -z "$BT_VERSION" ] && [ -n "$AGP_VERSION" ]; then
              AGP_MM=$(printf '%s' "$AGP_VERSION" | cut -d. -f1,2)
              case "$AGP_MM" in
                7.0|7.1|7.2|7.3|7.4) BT_VERSION="30.0.3" ;;
                8.0|8.1)             BT_VERSION="33.0.1" ;;
                8.2|8.3|8.4|8.5|8.6) BT_VERSION="34.0.0" ;;
                8.7|8.8|8.9|8.10)    BT_VERSION="35.0.0" ;;
                8.11|8.12|8.13|9.*)  BT_VERSION="36.0.0" ;;
                *)
                  [ -n "$COMPILE_SDK" ] && BT_VERSION="${COMPILE_SDK}.0.0"
                  ;;
              esac
              echo "Derived build-tools version from AGP $AGP_VERSION: ${BT_VERSION:-<unknown>}"
            elif [ -n "$BT_VERSION" ]; then
              echo "Using explicit buildToolsVersion from Gradle config: $BT_VERSION"
            fi

            if [ -z "$BT_VERSION" ] && [ -n "$COMPILE_SDK" ]; then
              BT_VERSION="${COMPILE_SDK}.0.0"
              echo "Derived build-tools version from compileSdkVersion $COMPILE_SDK: $BT_VERSION"
            fi

            if [ -z "$BT_VERSION" ]; then
              echo "::error::Could not determine required build-tools version from Gradle config or AGP (${AGP_VERSION:-<unknown>}); checked $BUILD_TOOLS_DIR"
              exit 1
            fi

            SDKMGR=""
            for mgr in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$mgr" ]; then
                SDKMGR="$mgr"
                break
              fi
            done
            if [ -z "$SDKMGR" ]; then
              SDKMGR=$(command -v sdkmanager 2>/dev/null || true)
            fi

            if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
              echo "Attempting to install build-tools;$BT_VERSION via $SDKMGR..."
              set +e
              (set +o pipefail; yes | "$SDKMGR" --sdk_root="$SDK_ROOT" "build-tools;$BT_VERSION")
              SDKMGR_EXIT=$?
              set -e
              if [ "$SDKMGR_EXIT" -ne 0 ]; then
                echo "::warning::sdkmanager exited with status $SDKMGR_EXIT"
              fi
              APKSIGNER=$(find_apksigner "$BUILD_TOOLS_DIR")
            else
              echo "::warning::sdkmanager not found under $SDK_ROOT or PATH"
            fi
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Could not locate apksigner. Checked directory: $BUILD_TOOLS_DIR (SDK_ROOT=$SDK_ROOT). Tried sdkmanager install of build-tools;${BT_VERSION:-<unknown>}."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          # ---- verify fingerprint ----
          if CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            :
          else
            APKSIGNER_EXIT=$?
            echo "::error::apksigner verify failed with exit code $APKSIGNER_EXIT"
            printf '%s\n' "$CERT_INFO"
            exit "$APKSIGNER_EXIT"
          fi

          RAW_FP=$(printf '%s\n' "$CERT_INFO" | grep -i 'SHA-256 digest:' | head -n1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//' || true)
          if [ -z "$RAW_FP" ]; then
            echo "::error::Could not extract SHA-256 fingerprint from APK using apksigner"
            echo "apksigner output:"
            printf '%s\n' "$CERT_INFO"
            exit 1
          fi

          normalize_fp() {
            printf '%s' "$1" | tr 'a-z' 'A-Z' | tr -cd '0-9A-F' | sed -E 's/(..)/\1:/g; s/:$//'
          }

          FP=$(normalize_fp "$RAW_FP")
          EXP=$(normalize_fp "$EXPECTED_FINGERPRINT")
          if [ "${#FP}" -ne 95 ]; then
            echo "::error::Extracted SHA-256 fingerprint has unexpected format: $FP"
            exit 1
          fi

          echo "APK SHA-256 fingerprint: $FP"
          if [ "$FP" = "$EXP" ]; then
            echo "Fingerprint MATCH (matches v1.0.3+ release key)"
          else
            echo "::warning::Fingerprint MISMATCH (expected $EXP, got $FP)"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Release tag build fingerprint does not match v1.0.3+ key — in-place update will fail"
              exit 1
            fi
          fi

      - name: Clean up signing keystore
        if: always()
        run: rm -f android/app/xuping-scanner.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xuping-scanner-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag builds only)
        if: ${{ github.event_name != 'workflow_dispatch' && steps.version.outputs.IS_RELEASE == 'true' && github.event.inputs.skip-release != 'true' }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}