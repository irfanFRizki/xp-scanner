<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>XUPING Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg-base:#0d0f12; --bg-surface:#151820; --bg-card:#1c2030; --bg-input:#111420;
    --border:#2a2f45; --border-light:#343b52;
    --text-pri:#e2e8f0; --text-sec:#8892a4; --text-muted:#525c70;
    --accent-green:#00e5a0; --accent-cyan:#00c8e0; --accent-red:#ef4444; --accent-amber:#f59e0b;
    --neon-glow:0 0 12px rgba(0,229,160,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg-base); color:var(--text-pri); font-family:'DM Sans',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{
    padding:18px 18px 14px; border-bottom:1px solid var(--border);
    background:linear-gradient(135deg,#0a0c14 0%,#131828 60%,#0d1020 100%);
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-family:'Space Mono',monospace; font-size:16px; margin:0; letter-spacing:.5px;}
  header h1 span{color:var(--accent-green); text-shadow:var(--neon-glow);}
  .gear{background:none;border:1px solid var(--border-light);color:var(--text-sec);width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;}
  .update-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(135deg, rgba(0,229,160,.12), rgba(0,200,224,.12));
    border-bottom:1px solid var(--border); padding:10px 16px; font-size:12.5px; color:var(--text-pri);
  }
  main{flex:1; padding:18px; display:flex; flex-direction:column; gap:16px;}

  .search-box{
    display:flex; gap:8px; background:var(--bg-input); border:1px solid var(--border);
    border-radius:10px; padding:6px; align-items:center;
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text-pri);
    font-family:'Space Mono',monospace; font-size:15px; padding:10px 8px;
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .btn{
    border:none; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif;
    font-weight:600; font-size:14px; padding:12px 16px; display:flex; align-items:center; gap:6px;
    transition:transform .1s ease, box-shadow .2s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent-green); color:#062018; box-shadow:var(--neon-glow);}
  .btn-cyan{background:var(--accent-cyan); color:#04212a;}
  .btn-outline{background:transparent; border:1px solid var(--border-light); color:var(--text-sec);}
  .btn-scan{
    width:100%; justify-content:center; padding:16px; font-size:15px;
    background:linear-gradient(135deg, var(--accent-cyan), var(--accent-green)); color:#04211a;
  }

  #reader{width:100%; border-radius:12px; overflow:hidden; border:1px solid var(--border); display:none;}
  #reader.active{display:block;}

  .result-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px;
    display:none;
  }
  .result-card.active{display:block;}
  .result-card .label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:4px;}
  .result-card .kode{
    font-family:'Space Mono',monospace; font-size:26px; font-weight:700; color:var(--accent-green);
    text-shadow:var(--neon-glow); word-break:break-all; margin-bottom:10px;
  }
  .result-card .deskripsi{color:var(--text-sec); font-size:14px; line-height:1.5;}
  .pl-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .pl-section{margin-top:14px;}
  .pl-section .pl-list{margin-top:6px;}
  .pl-section-label{margin-bottom:0;}
  .pl-hint{text-transform:none; letter-spacing:0; color:var(--text-muted); font-size:10px;}
  .pl-chip{
    font-family:'Space Mono',monospace; font-size:12px; color:var(--accent-cyan);
    background:rgba(0,200,224,.1); border:1px solid rgba(0,200,224,.3);
    border-radius:6px; padding:5px 10px;
  }
  .pl-chip.supplier{
    color:var(--accent-green); background:rgba(0,229,160,.1); border-color:rgba(0,229,160,.3);
  }
  .multi-item .pl-sub{color:var(--text-muted); font-size:11px; margin-top:2px; display:block;}
  .result-card .ref{margin-top:10px; font-size:12px; color:var(--text-muted); font-family:'Space Mono',monospace;}
  .foto-wrap{
    margin-top:12px; border-radius:10px; overflow:hidden; background:var(--bg-input);
    border:1px solid var(--border); min-height:70px; display:flex; align-items:center; justify-content:center;
  }
  .foto-wrap img{width:100%; max-height:340px; display:block; object-fit:contain; cursor:zoom-in;}
  .foto-status{font-size:12px; color:var(--text-muted); padding:22px 10px; text-align:center;}

  .multi-item{position:relative; padding-left:56px;}
  .multi-item .thumb{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:6px; object-fit:cover; background:var(--bg-input); border:1px solid var(--border);
  }

  .viewer-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center;
    z-index:60; padding:16px;
  }
  .viewer-bg.active{display:flex;}
  .viewer-bg img{max-width:100%; max-height:100%; border-radius:8px;}

  .status{font-size:13px; color:var(--text-sec); text-align:center; padding:8px;}
  .status.err{color:var(--accent-red);}
  .status.ok{color:var(--accent-green);}
  .status.loading{display:flex; align-items:center; justify-content:center; gap:8px; color:var(--accent-cyan);}
  .spinner{
    width:15px; height:15px; border:2px solid var(--border-light); border-top-color:var(--accent-cyan);
    border-radius:50%; display:inline-block; animation:spin .7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .btn[disabled]{opacity:.55; cursor:not-allowed;}
  .btn .spinner{border-color:rgba(0,0,0,.25); border-top-color:#062018;}

  .multi-list{display:flex; flex-direction:column; gap:8px;}
  .multi-item{
    background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .multi-item:active{border-color:var(--accent-cyan);}
  .multi-item .k{font-family:'Space Mono',monospace; color:var(--accent-green); font-size:15px;}
  .multi-item .d{color:var(--text-muted); font-size:12px; max-width:60%; text-align:right;}

  .history{margin-top:auto; padding-top:8px;}
  .history-title{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:8px;}
  .history-item{
    display:flex; justify-content:space-between; padding:8px 10px; border-bottom:1px solid var(--border);
    font-family:'Space Mono',monospace; font-size:12px; color:var(--text-sec);
  }

  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-bg.active{display:flex;}
  .modal{background:var(--bg-card); border:1px solid var(--border-light); border-radius:12px; padding:20px; width:100%; max-width:420px;}
  .modal h2{margin:0 0 12px; font-size:15px;}
  .modal label{font-size:12px; color:var(--text-sec); display:block; margin-bottom:6px;}
  .modal input{
    width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:8px;
    padding:10px; color:var(--text-pri); font-family:'Space Mono',monospace; font-size:13px; margin-bottom:14px;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>XUPING <span>SCANNER</span> <span id="appVersionBadge" style="font-size:10px; color:var(--text-muted); font-weight:400; -webkit-text-fill-color:var(--text-muted); text-shadow:none;"></span></h1>
    <button class="gear" id="btnSettings">⚙</button>
  </header>

  <div class="update-banner" id="updateBanner" style="display:none;">
    <span id="updateBannerText"></span>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-primary" id="btnDoUpdate" style="padding:7px 12px; font-size:12px;">Update Sekarang</button>
      <button class="btn btn-outline" id="btnDismissUpdate" style="padding:7px 10px; font-size:12px;">✕</button>
    </div>
  </div>

  <main>
    <div class="search-box">
      <input id="inputKode" type="text" placeholder="Ketik kode supplier..." autocomplete="off" autocapitalize="characters">
      <button class="btn btn-primary" id="btnCari">Cari</button>
    </div>

    <button class="btn btn-scan" id="btnScan">📷 Scan Barcode / QR</button>
    <button class="btn btn-outline" id="btnGallery" style="width:100%; justify-content:center;">🖼 Pilih dari Galeri</button>
    <input type="file" id="inputGallery" accept="image/*" style="display:none;">
    <div id="reader"></div>
    <div id="fileReader" style="position:absolute; left:-9999px;"></div>
    <button class="btn btn-outline" id="btnStopScan" style="display:none;">Tutup Kamera</button>

    <div id="status" class="status"></div>

    <div id="resultCard" class="result-card">
      <button class="btn btn-outline" id="btnBackToList" style="display:none; width:100%; justify-content:center; margin-bottom:12px;">&larr; Kembali ke daftar</button>
      <div class="label">Kode</div>
      <div class="kode" id="resKode">-</div>
      <div class="deskripsi" id="resDeskripsi"></div>

      <div class="pl-section">
        <div class="label pl-section-label">Kode Supplier</div>
        <div class="pl-list" id="plSupplierList"></div>
      </div>

      <div class="pl-section">
        <div class="label pl-section-label">Kode <span class="pl-hint">(semua tahun)</span></div>
        <div class="pl-list" id="plAllList"></div>
      </div>

      <div class="foto-wrap" id="fotoWrap"></div>

      <button class="btn btn-cyan" id="btnShare" style="width:100%; justify-content:center; margin-top:14px;">
        📤 Bagikan Hasil
      </button>
    </div>

    <div id="multiList" class="multi-list"></div>

    <div class="history">
      <div class="history-title">Riwayat Pencarian</div>
      <div id="historyList"></div>
    </div>
  </main>
</div>

<div class="viewer-bg" id="viewerBg">
  <img id="viewerImg" src="" alt="foto">
</div>

<div class="modal-bg" id="modalShare">
  <div class="modal">
    <h2>📤 Bagikan Ke</h2>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-primary" id="shareWhatsapp" style="justify-content:flex-start;">💬 WhatsApp</button>
      <button class="btn btn-cyan" id="shareTelegram" style="justify-content:flex-start;">✈️ Telegram</button>
      <button class="btn btn-outline" id="shareSms" style="justify-content:flex-start;">📱 SMS</button>
      <button class="btn btn-outline" id="shareCopy" style="justify-content:flex-start;">📋 Salin Teks</button>
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn btn-outline" id="btnCloseShare">Tutup</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalSettings">
  <div class="modal">
    <h2>⚙ Pengaturan Sumber Data</h2>
    <label>URL Web App GAS (hasil deploy Apps Script)</label>
    <input id="inputGasUrl" type="text" placeholder="https://script.google.com/macros/s/XXXXX/exec">

    <label>Repo GitHub untuk update (format: owner/nama-repo)</label>
    <input id="inputRepo" type="text" placeholder="irfanFRizki/xp-scanner">


    <div style="display:flex; align-items:center; justify-content:space-between; margin:14px 0; font-size:11px; color:var(--text-muted);">
      <span id="appVersionLabel">Versi terpasang: -</span>
      <button class="btn btn-outline" id="btnCheckUpdate" style="padding:6px 10px; font-size:11px;">🔄 Cek Update</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" id="btnCloseSettings">Batal</button>
      <button class="btn btn-primary" id="btnSaveSettings">Simpan</button>
    </div>
  </div>
</div>

<script>
(function(){
  var APP_VERSION = '1.0.0'; // ⚠️ Naikkan angka ini tiap kali rilis versi baru (samakan dengan tag git vX.Y.Z)
  var STORAGE_KEY_URL = 'xuping_gas_url';
  var STORAGE_KEY_HISTORY = 'xuping_history';
  var STORAGE_KEY_REPO = 'xuping_gh_repo';
  var qrRegionId = 'reader';
  var html5QrCode = null;
  var scanning = false;

  var $ = function(id){ return document.getElementById(id); };
  var elInput = $('inputKode');
  var elStatus = $('status');
  var elResultCard = $('resultCard');
  var elResKode = $('resKode');
  var elResDeskripsi = $('resDeskripsi');
  var elMultiList = $('multiList');
  var elHistoryList = $('historyList');
  var elReader = $('reader');
  var elBtnScan = $('btnScan');
  var elBtnStopScan = $('btnStopScan');
  var elBtnGallery = $('btnGallery');
  var elInputGallery = $('inputGallery');

  function getGasUrl(){ return localStorage.getItem(STORAGE_KEY_URL) || ''; }
  function setGasUrl(u){ localStorage.setItem(STORAGE_KEY_URL, u); }

  function getRepo(){ return localStorage.getItem(STORAGE_KEY_REPO) || ''; }
  function setRepo(r){ localStorage.setItem(STORAGE_KEY_REPO, r); }


  function getHistory(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]'); }
    catch(e){ return []; }
  }
  function pushHistory(ref, kode){
    var h = getHistory();
    h.unshift({ ref: ref, kode: kode, ts: Date.now() });
    h = h.slice(0, 20);
    localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(h));
    renderHistory();
  }
  function formatDate(ts){
    var d = new Date(ts);
    var day = ('0' + d.getDate()).slice(-2);
    var month = ('0' + (d.getMonth()+1)).slice(-2);
    var year = d.getFullYear();
    var hours = ('0' + d.getHours()).slice(-2);
    var minutes = ('0' + d.getMinutes()).slice(-2);
    return day + '/' + month + '/' + year + ' ' + hours + ':' + minutes;
  }

  function renderHistory(){
    var h = getHistory();
    elHistoryList.innerHTML = '';
    if (!h.length){
      elHistoryList.innerHTML = '<div class="history-item"><span>Belum ada riwayat</span></div>';
      return;
    }
    h.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'history-item';
      var tsHtml = item.ts ? '<span style="color:var(--text-muted);font-size:10px;margin-left:8px;">' + formatDate(item.ts) + '</span>' : '';
      row.innerHTML = '<span>' + escapeHtml(item.ref) + '</span><span>' + escapeHtml(item.kode) + tsHtml + '</span>';
      row.style.cursor = 'pointer';
      row.addEventListener('click', function(){
        elInput.value = item.ref;
        doLookup(item.ref);
      });
      elHistoryList.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function setStatus(msg, type){
    elStatus.textContent = msg || '';
    elStatus.className = 'status' + (type ? ' ' + type : '');
  }

  var elFotoWrap = $('fotoWrap');
  var elPlSupplierList = $('plSupplierList');
  var elPlAllList = $('plAllList');
  var elViewerBg = $('viewerBg');
  var elViewerImg = $('viewerImg');

  function renderFoto(container, url){
    container.innerHTML = '';
    if (!url){
      container.innerHTML = '<div class="foto-status">Foto tidak tersedia untuk kode ini</div>';
      return;
    }
    var status = document.createElement('div');
    status.className = 'foto-status';
    status.textContent = 'Memuat foto...';
    container.appendChild(status);

    var img = new Image();
    img.alt = 'foto barang';
    img.onload = function(){
      container.innerHTML = '';
      container.appendChild(img);
    };
    img.onerror = function(){
      container.innerHTML = '<div class="foto-status">Gagal memuat foto (link mungkin salah/rusak)</div>';
    };
    img.addEventListener('click', function(){ openViewer(url); });
    img.src = url;
  }

  function openViewer(url){
    elViewerImg.src = url;
    elViewerBg.classList.add('active');
  }
  function closeViewer(){
    elViewerBg.classList.remove('active');
    elViewerImg.src = '';
  }
  elViewerBg.addEventListener('click', closeViewer);

  function renderPlChips(container, list, chipClass){
    container.innerHTML = '';
    if (!list || !list.length){
      container.innerHTML = '<span class="pl-chip" style="opacity:.5;">-</span>';
      return;
    }
    list.forEach(function(pl){
      var chip = document.createElement('span');
      chip.className = 'pl-chip' + (chipClass ? ' ' + chipClass : '');
      chip.textContent = pl.label;
      container.appendChild(chip);
    });
  }

  var elBtnBack = document.getElementById("btnBackToList");
  var lastMultiContext = null;

  function showSingleResult(item, ref){
    elResultCard.classList.add('active');
    elMultiList.innerHTML = '';
    elResKode.textContent = item.kode;
    elResDeskripsi.textContent = item.deskripsi || '';

    renderPlChips(elPlSupplierList, item.plsSupplier, 'supplier');
    renderPlChips(elPlAllList, item.plsAll, '');

    renderFoto(elFotoWrap, item.foto || '');
    currentShareItem = item;

    if (lastMultiContext) {
      elBtnBack.style.display = 'flex';
      elBtnBack.textContent = '\u2190 Kembali ke daftar (' + lastMultiContext.list.length + ' hasil)';
    } else {
      elBtnBack.style.display = 'none';
    }
  }

  elBtnBack.addEventListener("click", function () {
    if (lastMultiContext) showMultiResult(lastMultiContext.list, lastMultiContext.ref);
  });

  function showMultiResult(list, ref){
    elBtnBack.style.display = "none";
    elResultCard.classList.remove('active');
    elMultiList.innerHTML = '';
    list.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'multi-item';
      var thumbHtml = item.foto
        ? '<img class="thumb" src="' + escapeHtml(item.foto) + '" onerror="this.style.visibility=\'hidden\'">'
        : '';
      var plLabels = (item.plsAll || []).map(function(pl){ return pl.label; }).join(' • ');
      var plHtml = plLabels ? '<span class="pl-sub">' + escapeHtml(plLabels) + '</span>' : '';
      row.innerHTML = thumbHtml +
        '<span style="flex:1;">' +
          '<span class="k">' + escapeHtml(item.kode) + '</span>' + plHtml +
        '</span>' +
        '<span class="d">' + escapeHtml(item.deskripsi || '') + '</span>';
      row.addEventListener('click', function(){
        showSingleResult(item, ref);
        elMultiList.innerHTML = '';
      });
      elMultiList.appendChild(row);
    });
  }

  function clearResult(){
    elBtnBack.style.display = "none";
    lastMultiContext = null;
    elResultCard.classList.remove('active');
    elMultiList.innerHTML = '';
    elFotoWrap.innerHTML = '';
    elPlSupplierList.innerHTML = '';
    elPlAllList.innerHTML = '';
    currentShareItem = null;
  }

  // JSONP call ke Web App GAS supaya tidak kena blokir CORS
  var jsonpCounter = 0;
  function jsonpRequest(baseUrl, params, callback, timeoutMs){
    var cbName = 'xupingCb_' + (jsonpCounter++) + '_' + Date.now();
    var script = document.createElement('script');
    var timeoutId;

    var qs = Object.keys(params).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');

    window[cbName] = function(data){
      cleanup();
      callback(null, data);
    };

    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    script.onerror = function(){
      cleanup();
      callback(new Error('Gagal terhubung ke Web App. Cek URL & koneksi internet.'));
    };

    timeoutId = setTimeout(function(){
      cleanup();
      var e = new Error('Server belum merespon.');
      e.isTimeout = true;
      callback(e);
    }, timeoutMs || 25000);

    script.src = baseUrl + (baseUrl.indexOf('?') === -1 ? '?' : '&') + qs + '&callback=' + cbName;
    document.body.appendChild(script);
  }

  var elBtnCari = $('btnCari');
  var btnCariOriginalHtml = elBtnCari.innerHTML;
  var isSearching = false;

  function setBusy(busy){
    isSearching = busy;
    elBtnCari.disabled = busy;
    elInput.disabled = busy;
    elBtnCari.innerHTML = busy ? '<span class="spinner"></span>' : btnCariOriginalHtml;
  }

  function setLoadingStatus(msg){
    elStatus.className = 'status loading';
    elStatus.innerHTML = '<span class="spinner"></span><span>' + escapeHtml(msg) + '</span>';
  }

  function doLookup(refCode){
    refCode = String(refCode || '').trim();
    if (!refCode){ setStatus('Ketik atau scan kode dulu.', 'err'); return; }
    if (isSearching) return;

    var gasUrl = getGasUrl();
    if (!gasUrl){
      setStatus('URL Web App belum diatur. Buka ⚙ Pengaturan dulu.', 'err');
      openSettings();
      return;
    }

    clearResult();
    setBusy(true);
    attemptLookup(gasUrl, refCode, 1);
  }

  // Percobaan pertama pakai timeout sedang; kalau timeout (server GAS lagi
  // "cold start" / sheet besar), otomatis coba sekali lagi dengan timeout
  // lebih panjang sebelum benar-benar menyerah ke user.
  function attemptLookup(gasUrl, refCode, attempt){
    var timeoutMs = attempt === 1 ? 25000 : 45000;
    setLoadingStatus(
      attempt === 1
        ? 'Mencari "' + refCode + '"...'
        : 'Server agak lambat, mencoba lagi...'
    );

    jsonpRequest(gasUrl, { action: 'lookup', kode: refCode }, function(err, data){
      if (err){
        if (err.isTimeout && attempt < 2){
          attemptLookup(gasUrl, refCode, attempt + 1);
          return;
        }
        setBusy(false);
        var extra = err.isTimeout
          ? ' Kalau ini sering terjadi, cek jumlah baris di sheet Packing List / Link foto — mungkin perlu dioptimalkan.'
          : '';
        setStatus(err.message + extra, 'err');
        return;
      }

      setBusy(false);
      if (!data || data.success === false){
        setStatus('Error: ' + (data && data.error ? data.error : 'tidak diketahui'), 'err');
        return;
      }
      var list = data.data || [];
      if (!list.length){
        setStatus('Kode "' + refCode + '" tidak ditemukan di Packing List.', 'err');
        return;
      }
      setStatus('Ditemukan ' + list.length + ' hasil.', 'ok');
      pushHistory(refCode, list[0].kode);
      if (list.length === 1){
        lastMultiContext = null;
        showSingleResult(list[0], refCode);
      } else {
        lastMultiContext = { list: list, ref: refCode };
        showMultiResult(list, refCode);
      }
    });
  }

  // ── Scan kamera ──────────────────────────────────────────
  function startScan(){
    if (scanning) return;
    elReader.classList.add('active');
    elBtnScan.style.display = 'none';
    elBtnStopScan.style.display = 'flex';
    setStatus('Arahkan kamera ke barcode/QR...', '');

    html5QrCode = new Html5Qrcode(qrRegionId);
    scanning = true;

    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      function onScanSuccess(decodedText){
        elInput.value = decodedText;
        stopScan();
        doLookup(decodedText);
      },
      function onScanFailure(){ /* diam saja, terus coba */ }
    ).catch(function(err){
      setStatus('Gagal membuka kamera: ' + err, 'err');
      stopScan();
    });
  }

  function stopScan(){
    if (html5QrCode && scanning){
      html5QrCode.stop().then(function(){
        html5QrCode.clear();
      }).catch(function(){});
    }
    scanning = false;
    elReader.classList.remove('active');
    elBtnScan.style.display = 'flex';
    elBtnStopScan.style.display = 'none';
  }

  function scanFromFile(file){
    if (!file) return;
    setLoadingStatus('Membaca barcode dari gambar...');
    Promise.resolve().then(function(){
      return new Html5Qrcode('fileReader').scanFileV2(file, false);
    }).then(function(res){
      var decodedText = res && res.decodedText ? String(res.decodedText).trim() : '';
      if (!decodedText) throw new Error('empty');
      if (scanning) stopScan();
      elInput.value = decodedText;
      doLookup(decodedText);
    }).catch(function(){
      setStatus('Tidak ada barcode/QR yang terbaca di gambar.', 'err');
    });
  }

  // ── Settings modal ───────────────────────────────────────
  function openSettings(){
    $('inputGasUrl').value = getGasUrl();
    $('inputRepo').value = getRepo();
    $('appVersionLabel').textContent = 'Versi terpasang: v' + APP_VERSION;
    $('modalSettings').classList.add('active');
  }
  function closeSettings(){
    $('modalSettings').classList.remove('active');
  }

  // ── Bagikan hasil (WhatsApp / Telegram / SMS / dll) ──────
  var currentShareItem = null;

  function padLabel(label, width){
    // Bikin spasi rata seperti contoh template (Kode/Descripsi/Url)
    var pad = '';
    for (var i = label.length; i < width; i++) pad += ' ';
    return label + pad;
  }

  function buildShareText(item){
    var plLines = (item.plsAll && item.plsAll.length)
      ? item.plsAll.map(function(pl){ return pl.label; }).join('\n')
      : '-';

    return '*DATA TERLAMPIR*\n' +
      '----------------------------\n' +
      'Kode         : *' + item.kode + '*\n' +
      'Descripsi : ' + (item.deskripsi || '-') + '\n' +
      'Url             : ' + (item.foto || '-') + '\n' +
      plLines + '\n' +
      '----------------------------\n' +
      '*TERIMA KASIH*';
  }

  async function shareCurrentResult(){
    if (!currentShareItem){ setStatus('Cari kode dulu sebelum membagikan.', 'err'); return; }
    var text = buildShareText(currentShareItem);

    // 1) Coba plugin native Capacitor Share dulu — ini buka share sheet
    //    asli Android yang otomatis list semua app terinstall.
    try {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
        await window.Capacitor.Plugins.Share.share({ text: text });
        return;
      }
    } catch (e) { /* user batal / gagal → lanjut fallback di bawah */ }

    // 2) Fallback: Web Share API standar (browser/PWA)
    try {
      if (navigator.share) {
        await navigator.share({ text: text });
        return;
      }
    } catch (e) { /* lanjut fallback berikutnya */ }

    // 3) Fallback terakhir: modal manual dengan link WA/Telegram/SMS/Copy
    openShareModal(text);
  }

  function openShareModal(text){
    pendingShareText = text;
    $('modalShare').classList.add('active');
  }
  function closeShareModal(){
    $('modalShare').classList.remove('active');
  }

  var pendingShareText = '';

  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        setStatus('Teks disalin ke clipboard.', 'ok');
      }).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); setStatus('Teks disalin ke clipboard.', 'ok'); }
    catch(e){ setStatus('Gagal menyalin teks.', 'err'); }
    document.body.removeChild(ta);
  }

  $('btnShare').addEventListener('click', shareCurrentResult);
  $('btnCloseShare').addEventListener('click', closeShareModal);
  $('modalShare').addEventListener('click', function(e){ if (e.target.id === 'modalShare') closeShareModal(); });

  $('shareWhatsapp').addEventListener('click', function(){
    window.open('https://wa.me/?text=' + encodeURIComponent(pendingShareText), '_blank');
    closeShareModal();
  });
  $('shareTelegram').addEventListener('click', function(){
    window.open('https://t.me/share/url?url=&text=' + encodeURIComponent(pendingShareText), '_blank');
    closeShareModal();
  });
  $('shareSms').addEventListener('click', function(){
    window.location.href = 'sms:?body=' + encodeURIComponent(pendingShareText);
    closeShareModal();
  });
  $('shareCopy').addEventListener('click', function(){
    copyToClipboard(pendingShareText);
    closeShareModal();
  });

  // ── Update aplikasi dari GitHub Releases ─────────────────
  var elUpdateBanner = $('updateBanner');
  var elUpdateBannerText = $('updateBannerText');
  var elBtnDoUpdate = $('btnDoUpdate');
  var btnDoUpdateOriginalText = elBtnDoUpdate.textContent;
  var latestVersionInfo = null; // { tag, apkUrl, size, localUri, ready }
  var autoDownloadInFlight = false;

  function isNewerVersion(remote, local){
    var r = String(remote).replace(/^v/i, '').split('.').map(Number);
    var l = String(local).replace(/^v/i, '').split('.').map(Number);
    var len = Math.max(r.length, l.length);
    for (var i = 0; i < len; i++){
      var rv = r[i] || 0, lv = l[i] || 0;
      if (rv > lv) return true;
      if (rv < lv) return false;
    }
    return false;
  }

  function showUpdateBanner(tag){
    elUpdateBannerText.textContent = '🎉 Update v' + tag.replace(/^v/i,'') + ' ditemukan, mengunduh otomatis...';
    elBtnDoUpdate.disabled = true;
    elBtnDoUpdate.textContent = 'Mengunduh...';
    elUpdateBanner.style.display = 'flex';
  }
  function setBannerDownloading(tag, pct){
    elUpdateBannerText.textContent = 'Mengunduh update v' + tag.replace(/^v/i,'') + ' (' + pct + '%)...';
  }
  function setBannerReady(tag){
    elUpdateBannerText.textContent = '✅ Update v' + tag.replace(/^v/i,'') + ' siap dipasang!';
    elBtnDoUpdate.disabled = false;
    elBtnDoUpdate.textContent = 'Pasang Sekarang';
  }
  function hideUpdateBanner(){
    elUpdateBanner.style.display = 'none';
    elBtnDoUpdate.disabled = false;
    elBtnDoUpdate.textContent = btnDoUpdateOriginalText;
  }

  async function checkForUpdate(silent){
    var repo = getRepo();
    if (!repo){
      if (!silent) setStatus("Isi dulu Repo GitHub di menu Pengaturan.", "err");
      return;
    }
    try {
      var res = await fetch("https://api.github.com/repos/" + repo + "/releases/latest");
      if (!res.ok) throw new Error("Repo/release tidak ditemukan (HTTP " + res.status + ")");
      var data = await res.json();
      var tag = (data.tag_name || "").trim();
      var asset = (data.assets || []).find(function(a){ return /\.apk$/i.test(a.name); });
      if (!tag || !asset) throw new Error("Release ada tapi tidak ada file .apk terlampir");
      if (isNewerVersion(tag, APP_VERSION)){
        var samaVersiSblmnya = latestVersionInfo && latestVersionInfo.tag === tag;
        latestVersionInfo = {
          tag: tag,
          apkUrl: asset.browser_download_url,
          size: asset.size,
          localUri: samaVersiSblmnya ? latestVersionInfo.localUri : null,
          ready: samaVersiSblmnya ? latestVersionInfo.ready : false
        };
        if (latestVersionInfo.ready){
          setBannerReady(tag);
          elUpdateBanner.style.display = 'flex';
        } else {
          showUpdateBanner(tag);
          autoDownloadUpdate(); // unduh sendiri di background, tanpa perlu tap apa pun
        }
        if (!silent) setStatus("Update v" + tag.replace(/^v/i,"") + " tersedia.", "ok");
      } else {
        hideUpdateBanner();
        if (!silent) setStatus("Aplikasi sudah versi terbaru (v" + APP_VERSION + ").", "ok");
      }
    } catch (err){
      if (!silent) setStatus("Gagal cek update: " + err.message, "err");
    }
  }

  function arrayBufferToBase64(buffer){
    var binary = '';
    var bytes = new Uint8Array(buffer);
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function downloadWithProgress(url, onProgress){
    return new Promise(function(resolve, reject){
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.onprogress = function(e){
        if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = function(){
        if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
        else reject(new Error('Download gagal (HTTP ' + xhr.status + ')'));
      };
      xhr.onerror = function(){ reject(new Error('Download gagal — cek koneksi internet.')); };
      xhr.send();
    });
  }

  // Download APK otomatis di background begitu update terdeteksi — user
  // tidak perlu tap apa pun untuk memulai unduhan, cukup tap "Pasang
  // Sekarang" begitu file selesai diunduh. Nama file menyertakan nomor
  // versi, jadi kalau app dibuka lagi sebelum sempat install, tidak
  // perlu download ulang dari awal.
  async function autoDownloadUpdate(){
    if (!latestVersionInfo || latestVersionInfo.ready || autoDownloadInFlight) return;
    var Plugins = window.Capacitor && window.Capacitor.Plugins;
    if (!Plugins || !Plugins.Filesystem) return; // di browser biasa, lewati diam-diam

    autoDownloadInFlight = true;
    var tag = latestVersionInfo.tag;
    var fileName = 'xuping-update-' + tag.replace(/[^a-zA-Z0-9_.-]/g, '') + '.apk';

    try {
      try {
        await Plugins.Filesystem.stat({ path: fileName, directory: 'CACHE' });
        var uriResExisting = await Plugins.Filesystem.getUri({ path: fileName, directory: 'CACHE' });
        if (latestVersionInfo && latestVersionInfo.tag === tag){
          latestVersionInfo.localUri = uriResExisting.uri;
          latestVersionInfo.ready = true;
          setBannerReady(tag);
        }
        return;
      } catch (eStat) { /* belum pernah diunduh, lanjut download di bawah */ }

      var buffer = await downloadWithProgress(latestVersionInfo.apkUrl, function(pct){
        if (latestVersionInfo && latestVersionInfo.tag === tag) setBannerDownloading(tag, pct);
      });
      var base64 = arrayBufferToBase64(buffer);
      await Plugins.Filesystem.writeFile({ path: fileName, data: base64, directory: 'CACHE' });
      var uriRes = await Plugins.Filesystem.getUri({ path: fileName, directory: 'CACHE' });

      if (latestVersionInfo && latestVersionInfo.tag === tag){
        latestVersionInfo.localUri = uriRes.uri;
        latestVersionInfo.ready = true;
        setBannerReady(tag);
      }
    } catch (err){
      if (latestVersionInfo && latestVersionInfo.tag === tag){
        elUpdateBannerText.textContent = 'Gagal unduh otomatis: ' + err.message;
        elBtnDoUpdate.disabled = false;
        elBtnDoUpdate.textContent = 'Coba Lagi';
      }
    } finally {
      autoDownloadInFlight = false;
    }
  }

  async function doUpdate(){
    if (!latestVersionInfo){ setStatus('Belum ada info update. Cek update dulu.', 'err'); return; }
    var Plugins = window.Capacitor && window.Capacitor.Plugins;
    if (!Plugins || !Plugins.ApkInstaller || !Plugins.Filesystem){
      setStatus('Fitur update cuma jalan di APK terpasang, bukan di browser.', 'err');
      return;
    }

    if (!latestVersionInfo.ready || !latestVersionInfo.localUri){
      setStatus('Update masih diunduh, tunggu sebentar lalu tap lagi.', 'err');
      autoDownloadUpdate();
      return;
    }

    try {
      var perm = await Plugins.ApkInstaller.canInstall();
      if (!perm.allowed){
        setLoadingStatus('Minta izin "Install app tidak dikenal"...');
        await Plugins.ApkInstaller.requestInstallPermission();
        setStatus('Aktifkan izin "Izinkan dari sumber ini" di layar yang terbuka, lalu tap Pasang Sekarang lagi.', 'err');
        return;
      }
      setLoadingStatus('Membuka installer...');
      await Plugins.ApkInstaller.install({ path: latestVersionInfo.localUri });
      setStatus('Installer dibuka - ikuti langkah install di layar.', 'ok');
      hideUpdateBanner();
    } catch (err){
      setStatus('Update gagal: ' + err.message, 'err');
    }
  }

  $('btnDoUpdate').addEventListener('click', doUpdate);
  $('btnDismissUpdate').addEventListener('click', hideUpdateBanner);
  $('btnCheckUpdate').addEventListener('click', function(){ checkForUpdate(false); });

  // ── Event bindings ───────────────────────────────────────
  $('btnCari').addEventListener('click', function(){ doLookup(elInput.value); });
  elInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLookup(elInput.value); });
  elBtnScan.addEventListener('click', startScan);
  elBtnStopScan.addEventListener('click', stopScan);
  elBtnGallery.addEventListener('click', function(){
    elInputGallery.value = '';
    elInputGallery.click();
  });
  elInputGallery.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    elInputGallery.value = '';
    if (file) scanFromFile(file);
  });
  $('btnSettings').addEventListener('click', openSettings);
  $('btnCloseSettings').addEventListener('click', closeSettings);
  $('btnSaveSettings').addEventListener('click', function(){
    setGasUrl($('inputGasUrl').value.trim());
    setRepo($('inputRepo').value.trim());
    closeSettings();
    setStatus('Pengaturan disimpan.', 'ok');
  });

  renderHistory();
  var elVersionBadge = document.getElementById('appVersionBadge');
  if (elVersionBadge) elVersionBadge.textContent = 'v' + APP_VERSION;

  if (!getGasUrl()) openSettings();
  checkForUpdate(true); // cek update senyap saat app dibuka, tanpa ganggu user kalau gagal/tidak ada update
})();
</script>
